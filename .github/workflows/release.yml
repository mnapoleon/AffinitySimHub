name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR and bump type
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              "GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              }
            );

            const pull = response.data.find(pr =>
              pr.merged_at &&
              pr.base &&
              pr.base.ref === "main"
            );

            if (!pull) {
              core.notice(`No merged pull request found for commit ${context.sha}; skipping release.`);
              core.setOutput("should_release", "false");
              return;
            }

            const title = pull.title.trim();
            const match = title.match(/^(major|minor|patch):\s+(.+)$/i);
            if (!match) {
              core.setFailed(
                `Merged PR title "${title}" does not match the required semver prefix format.`
              );
              return;
            }

            core.setOutput("should_release", "true");
            core.setOutput("pull_number", String(pull.number));
            core.setOutput("pull_title", title);
            core.setOutput("bump", match[1].toLowerCase());

      - name: Compute next semantic version
        id: version
        if: steps.pr.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $bump = '${{ steps.pr.outputs.bump }}'
          $tagNames = git tag --list | Where-Object { $_ -match '^v(\d+)\.(\d+)\.(\d+)$' }

          $versions = foreach ($tag in $tagNames) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              [pscustomobject]@{
                Tag = $tag
                Major = [int]$matches[1]
                Minor = [int]$matches[2]
                Patch = [int]$matches[3]
              }
            }
          }

          if ($versions) {
            $latest = $versions |
              Sort-Object Major, Minor, Patch |
              Select-Object -Last 1
            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch
          } else {
            $major = 0
            $minor = 0
            $patch = 0
          }

          switch ($bump) {
            'major' {
              $major += 1
              $minor = 0
              $patch = 0
            }
            'minor' {
              $minor += 1
              $patch = 0
            }
            'patch' {
              $patch += 1
            }
            default {
              throw "Unsupported bump type: $bump"
            }
          }

          $nextTag = "v$major.$minor.$patch"
          "tag=$nextTag" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        if: steps.pr.outputs.should_release == 'true'
        uses: actions/github-script@v7
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ steps.pr.outputs.pull_title }}
          PR_NUMBER: ${{ steps.pr.outputs.pull_number }}
        with:
          script: |
            const tag = process.env.NEXT_TAG;
            const pullTitle = process.env.PR_TITLE;
            const pullNumber = process.env.PR_NUMBER;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              core.notice(`Tag ${tag} already exists; skipping tag and release creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
              body: `Released from PR #${pullNumber}: ${pullTitle}`,
            });

            core.notice(`Created ${tag} and published a GitHub release.`);
