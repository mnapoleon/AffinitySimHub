name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $bump = '${{ inputs.bump }}'.Trim().ToLowerInvariant()
          if ($bump -notin @('patch', 'minor', 'major')) {
            throw "Unsupported bump type: $bump"
          }

          "bump=$bump" >> $env:GITHUB_OUTPUT
          "target_ref=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          "target_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - name: Compute next semantic version
        id: version
        shell: pwsh
        run: |
          $bump = '${{ steps.release_meta.outputs.bump }}'
          $tagNames = git tag --list | Where-Object { $_ -match '^v(\d+)\.(\d+)\.(\d+)$' }

          $versions = foreach ($tag in $tagNames) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              [pscustomobject]@{
                Tag = $tag
                Major = [int]$matches[1]
                Minor = [int]$matches[2]
                Patch = [int]$matches[3]
              }
            }
          }

          if ($versions) {
            $latest = $versions |
              Sort-Object Major, Minor, Patch |
              Select-Object -Last 1
            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch
            $previousTag = $latest.Tag
          } else {
            $major = 0
            $minor = 0
            $patch = 0
            $previousTag = ''
          }

          switch ($bump) {
            'major' {
              $major += 1
              $minor = 0
              $patch = 0
            }
            'minor' {
              $minor += 1
              $patch = 0
            }
            'patch' {
              $patch += 1
            }
            default {
              throw "Unsupported bump type: $bump"
            }
          }

          $nextTag = "v$major.$minor.$patch"
          $nextVersion = "$major.$minor.$patch"
          "tag=$nextTag" >> $env:GITHUB_OUTPUT
          "version=$nextVersion" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $previousTag = '${{ steps.version.outputs.previous_tag }}'
          $nextTag = '${{ steps.version.outputs.tag }}'
          $targetRef = '${{ steps.release_meta.outputs.target_ref }}'
          $targetSha = '${{ steps.release_meta.outputs.target_sha }}'
          $bump = '${{ steps.release_meta.outputs.bump }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $range = (git rev-list --max-parents=0 HEAD | Select-Object -First 1) + '..' + $targetSha
            $previousLabel = 'Initial release'
          } else {
            $range = "$previousTag..$targetSha"
            $previousLabel = $previousTag
          }

          $commitLines = git log $range --pretty=format:'- %s (%h)'
          if ([string]::IsNullOrWhiteSpace(($commitLines -join '').Trim())) {
            $commitLines = '- No additional commits found in release range.'
          }

          @(
            "# $nextTag"
            ""
            "## Release Summary"
            "- Semver bump: $bump"
            "- Released from ref: $targetRef"
            "- Target commit: $targetSha"
            "- Previous release: $previousLabel"
            ""
            "## Changes Since Last Release"
            $commitLines
          ) | Set-Content -Path $notesPath -Encoding UTF8

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore .\Affinity.sln /p:UseSimHubSdkStubs=true

      - name: Build plugin
        shell: pwsh
        run: dotnet build .\Affinity\Affinity.csproj --configuration Release --no-restore /p:UseSimHubSdkStubs=true /p:SimHubInstallPath=C:\does-not-exist /p:Version=${{ steps.version.outputs.version }} /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $buildOutput = '.\Affinity\bin\Release\net48'
          $installerDir = Join-Path $env:RUNNER_TEMP 'affinity-installer'
          $assetName = "AffinitySetup-$tag.exe"
          $assetPath = Join-Path $installerDir $assetName

          $requiredFiles = @(
            'Affinity.dll'
            'ac_track_id_map.json'
            'System.Data.SQLite.dll'
            'x64\SQLite.Interop.dll'
            'x86\SQLite.Interop.dll'
          )

          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $buildOutput $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Release output is missing required installer file: $requiredPath"
            }
          }

          Remove-Item -LiteralPath $installerDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installerDir | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc '.\Installer\AffinitySetup.iss' "/DMyAppVersion=$version" "/DMyOutputDir=$installerDir"

          if (-not (Test-Path -LiteralPath $assetPath)) {
            throw "Installer was not created at $assetPath"
          }

          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        id: release
        uses: actions/github-script@v7
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.NEXT_TAG;
            const releaseBody = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              core.notice(`Tag ${tag} already exists; skipping tag and release creation.`);
              const existingRelease = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput("release_id", String(existingRelease.data.id));
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: "${{ steps.release_meta.outputs.target_sha }}",
            });

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: "${{ steps.release_meta.outputs.target_sha }}",
              name: tag,
              body: releaseBody,
            });

            core.setOutput("release_id", String(release.data.id));
            core.notice(`Created ${tag} and published a GitHub release.`);

      - name: Upload installer asset
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          ASSET_NAME: ${{ steps.installer.outputs.asset_name }}
          ASSET_PATH: ${{ steps.installer.outputs.asset_path }}
        with:
          script: |
            const fs = require("fs");
            const releaseId = Number(process.env.RELEASE_ID);
            const assetName = process.env.ASSET_NAME;
            const assetPath = process.env.ASSET_PATH;
            const assetData = fs.readFileSync(assetPath);

            const existingAssets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const existingAsset = existingAssets.data.find(asset => asset.name === assetName);
            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingAsset.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: assetName,
              data: assetData,
            });

            core.notice(`Uploaded ${assetName} to release ${releaseId}.`);
