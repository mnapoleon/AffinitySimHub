name: Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Resolve merged PR and bump type
        id: pr
        shell: pwsh
        run: |
          $title = '${{ github.event.pull_request.title }}'.Trim()
          $match = [regex]::Match($title, '^(major|minor|patch):\s+(.+)$', [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)

          if (-not $match.Success) {
            throw "Merged PR title '$title' does not match the required semver prefix format."
          }

          "should_release=true" >> $env:GITHUB_OUTPUT
          "pull_number=${{ github.event.pull_request.number }}" >> $env:GITHUB_OUTPUT
          "pull_title=$title" >> $env:GITHUB_OUTPUT
          "bump=$($match.Groups[1].Value.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Compute next semantic version
        id: version
        if: steps.pr.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $bump = '${{ steps.pr.outputs.bump }}'
          $tagNames = git tag --list | Where-Object { $_ -match '^v(\d+)\.(\d+)\.(\d+)$' }

          $versions = foreach ($tag in $tagNames) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              [pscustomobject]@{
                Tag = $tag
                Major = [int]$matches[1]
                Minor = [int]$matches[2]
                Patch = [int]$matches[3]
              }
            }
          }

          if ($versions) {
            $latest = $versions |
              Sort-Object Major, Minor, Patch |
              Select-Object -Last 1
            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch
            $previousTag = $latest.Tag
          } else {
            $major = 0
            $minor = 0
            $patch = 0
            $previousTag = ''
          }

          switch ($bump) {
            'major' {
              $major += 1
              $minor = 0
              $patch = 0
            }
            'minor' {
              $minor += 1
              $patch = 0
            }
            'patch' {
              $patch += 1
            }
            default {
              throw "Unsupported bump type: $bump"
            }
          }

          $nextTag = "v$major.$minor.$patch"
          "tag=$nextTag" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        if: steps.pr.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $previousTag = '${{ steps.version.outputs.previous_tag }}'
          $nextTag = '${{ steps.version.outputs.tag }}'
          $pullNumber = '${{ steps.pr.outputs.pull_number }}'
          $pullTitle = '${{ steps.pr.outputs.pull_title }}'
          $bump = '${{ steps.pr.outputs.bump }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $range = (git rev-list --max-parents=0 HEAD | Select-Object -First 1) + '..' + '${{ github.event.pull_request.merge_commit_sha }}'
            $previousLabel = 'Initial release'
          } else {
            $range = "$previousTag..${{ github.event.pull_request.merge_commit_sha }}"
            $previousLabel = $previousTag
          }

          $commitLines = git log $range --pretty=format:'- %s (%h)'
          if ([string]::IsNullOrWhiteSpace(($commitLines -join '').Trim())) {
            $commitLines = '- No additional commits found in release range.'
          }

          @(
            "# $nextTag"
            ""
            "## Release Summary"
            "- Semver bump: $bump"
            "- Released from PR #$($pullNumber): $pullTitle"
            "- Previous release: $previousLabel"
            ""
            "## Changes Since Last Release"
            $commitLines
          ) | Set-Content -Path $notesPath -Encoding UTF8

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        if: steps.pr.outputs.should_release == 'true'
        uses: actions/github-script@v7
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.NEXT_TAG;
            const releaseBody = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              core.notice(`Tag ${tag} already exists; skipping tag and release creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: "${{ github.event.pull_request.merge_commit_sha }}",
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: "${{ github.event.pull_request.merge_commit_sha }}",
              name: tag,
              body: releaseBody,
            });

            core.notice(`Created ${tag} and published a GitHub release.`);
